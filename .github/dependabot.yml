# Version updates (security-only updates were already on). Actions are
# pinned to commit SHAs in the workflows; Dependabot bumps the SHA and the
# trailing "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine minor/patch churn; majors stay separate so
      # each gets its own look.
      minor-and-patch:
        update-types: ["minor", "patch"]
