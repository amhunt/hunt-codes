name: Preview

# Every PR gets a Cloudflare Workers preview of the `staging` env (the
# andysartifacts.com Worker): a version is uploaded but NOT deployed, so the
# live site is untouched, and its *.workers.dev preview URL is posted on the PR.
# Needs the CLOUDFLARE_API_TOKEN secret (Workers Scripts:Edit) and the
# CLOUDFLARE_ACCOUNT_ID repo variable.

on:
  pull_request:
    branches: [master]
    # `edited` is the activity type a base-branch retarget arrives as. A
    # stacked PR whose parent just merged is retargeted to master without a
    # push, so on the default types it never got a preview. Title/body
    # edits are the same type; the job condition below skips those.
    types: [opened, synchronize, reopened, edited]

concurrency:
  # One build per PR, newest wins. An `edited` event the job below will
  # skip (title/body, no base change) gets a group of its own — in the
  # shared group it would cancel an in-flight build for nothing.
  group: preview-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && github.event.changes.base.ref.from == '' && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Workers preview
    # Fork PRs have no access to the API token; skip rather than fail. Of
    # the `edited` events, only a base change (payload carries
    # `changes.base`) is worth a build.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build

      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # The alias gives each PR a stable URL that follows its latest push.
          command: versions upload --env staging --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        with:
          script: |
            const urls = [...new Set(process.env.OUTPUT.match(/https:\/\/[\w.-]+\.workers\.dev\S*/g) ?? [])];
            const marker = "<!-- workers-preview -->";
            const body = urls.length
              ? `${marker}\n**Preview** (staging env, andysartifacts.com build):\n${urls.map((u) => `- ${u}`).join("\n")}\n\n_Updated for ${context.payload.pull_request.head.sha.slice(0, 7)}._`
              : `${marker}\nPreview upload ran but no preview URL was found in the wrangler output; check the workflow log.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
